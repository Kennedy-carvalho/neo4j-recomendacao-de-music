<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
  <title id="title">Music recommendation graph model</title>
  <desc id="description">Users listen to tracks; tracks connect to artists, genres, and tags.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546275"/>
    </marker>
    <style>
      .edge { stroke: #546275; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 15px Arial, sans-serif; fill: #263445; }
      .node-title { font: bold 19px Arial, sans-serif; fill: #142033; }
      .property { font: 14px Arial, sans-serif; fill: #334155; }
      .node { stroke: #334155; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <line class="edge" x1="210" y1="110" x2="370" y2="188"/>
  <line class="edge" x1="530" y1="188" x2="685" y2="100"/>
  <line class="edge" x1="530" y1="210" x2="685" y2="210"/>
  <line class="edge" x1="530" y1="232" x2="685" y2="320"/>
  <text class="label" x="257" y="130">LISTENED_TO {playcount}</text>
  <text class="label" x="555" y="128">PERFORMED_BY</text>
  <text class="label" x="585" y="195">IN_GENRE</text>
  <text class="label" x="575" y="290">HAS_TAG</text>
  <rect class="node" x="55" y="65" width="165" height="90" fill="#ffd7a8"/>
  <text class="node-title" x="82" y="102">User</text>
  <text class="property" x="82" y="128">userId</text>
  <rect class="node" x="365" y="155" width="170" height="110" fill="#ffe081"/>
  <text class="node-title" x="415" y="193">Track</text>
  <text class="property" x="388" y="220">trackId, name, artist</text>
  <text class="property" x="405" y="243">audio features</text>
  <rect class="node" x="680" y="55" width="165" height="90" fill="#b9ddff"/>
  <text class="node-title" x="717" y="92">Artist</text>
  <text class="property" x="704" y="118">name</text>
  <rect class="node" x="680" y="165" width="165" height="90" fill="#d9c8ef"/>
  <text class="node-title" x="720" y="202">Genre</text>
  <text class="property" x="704" y="228">name</text>
  <rect class="node" x="680" y="275" width="165" height="90" fill="#c6efce"/>
  <text class="node-title" x="730" y="312">Tag</text>
  <text class="property" x="704" y="338">name</text>
</svg>
